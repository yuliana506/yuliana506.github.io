<!DOCTYPE html>
<html>
    <head>
        <title>
            Belajar Membuat HTML
        </title>
    </head>
    <body>
      <h1 align="center" >Belajar Membuat HTML</h1>
      <br>
    <form action="formulir.html" method="get">
      <div class="form-group">
        <label for="nama_kamu"> Nama:</label>
        <input type="text" id="nama_kamu" for="nama_kamu">
      </div>
      <br>
    <!-- <form action="formulir.html" method="get"></form> -->
      <div class="form-group">
        <label for="pasword">Password</label>
        <input type="text" id="password" for="password">
        <br>
      </div>
      <br>
       <!-- <form action="formulir.html" method="get"></form> -->
      <div class="form-group">
        <label for="jenis_kelamin">jenis_kelamin</label>
        <input type="radio" id="Laki-Laki" for="jenis_kelamin" >
        Laki-Laki
        <input type="radio" id="perempuan" for="jenis_kelamin" >
        perempuan
        </div>
        <br>
        <!-- <form action="formulir.html" method="get"></form> -->
        <div class="form-group">
            <label for="hobi">Hobi</label>
            <input type="checkbox" id="hobi_baca" > Membaca buku
            <input type="checkbox" id="hobi_nulis" > menulis
            <input type="checkbox" id="hobi_mancing" > memancing
        </div>
        <br>
        <!-- <form action="formulir.html" method="get"></form> -->
        <div class="form-group">
            <label for="asal_kota">Asal kota</label>
            <select name="asal_kota">
           <option type="option"  value="Kota_jakarta" for="asal_kota">Jakarta</option>
           <option type="option"  value="Kota_bandung" for="asal_kota">bandung</option>
           <option type="option"  value="Kota_semarang" for="asal_kota">semarang</option>
           </select>
        </div>
        <br>
        <!-- <form action="formulir.html" method="get"></form> -->
        <label for="komentar"> Komentar Anda:</label>
        <br>
        <textarea name="komentar_anda" for="komentar" rows="5" cols="20">
            silahkan katan isi hati anda
        </textarea>
        <br>
        <input type="submit" value="Mulai Proses!">
      </form>
    </body>
</html>
